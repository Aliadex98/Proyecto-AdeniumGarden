<!doctype html>
<html lang="es-CU">
  <head>
    <meta charset="utf-8" />
    <title>Adenium Garden</title>
    <meta name="author" content="Aliadex" />
    <meta name="description" content="Tienda de adenios y suculentas" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles/index.css" />
    <link rel="stylesheet" href="/styles/header.css" />
    <link rel="stylesheet" href="/styles/menuLateral.css" />
    <link rel="stylesheet" href="/styles/burgerMenu.css" />
  </head>
  <body>
    <!--Contenedor Principal del Header-->

    <header class="header">
      <!--Zona izq del header-->
      <div class="headerIzq">
        <img class="headerLogoImg" src="/assets/images/logotipo_AGB.png" alt="Logo de Adenium Garden" />
      </div>
      <!--Zona central del header-->

      <div class="headerCentro">
        <p class="headerTitulo">Adenium Garden</p>
        <p class="slogan">Bienvenidos al jardin</p>
      </div>
      <!--Zona derecha del header-->
      <div class="headerDerecha">
        <button
          class="headerBtn"
          type="button"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="modalLoggin"
        >
          Entrar
        </button>
        <button
          class="menuLateral"
          id="menuLateral"
          type="button"
          aria-expanded="false"
          aria-controls="sidebar"
          aria-label="Abrir menu"
        >
          <span class="bar"></span>
        </button>
      </div>
    </header>
    <!--Menu lateral-->
    <div id="overlay" class="overlay"></div>

    <aside id="sidebar" class="sidebar">
      <div class="asidecont">
        <header class="asideHeader"><h2 class="asidetitulo">Menu</h2></header>
        <ul class="mainMenu">
          <li><a href="">ejemplo1</a></li>
          <li><a href="">ejemplo2</a></li>
          <li><a href="">ejemplo3</a></li>
          <li><a href="">ejemplo4</a></li>
        </ul>
      </div>
    </aside>
    <!--Main Zone-->
    <main>
      <!--Hero Zone-->
    </main>

    <footer class="footer">
      <div class="footer-container">
        <!-- Sección principal del footer-->
        <div class="footer-brand">
          <h3>Templar Development Company</h3>
          <p>Construyendo soluciones digitales con precisión y excelencia.</p>
        </div>
      </div>
      <!-- Línea inferior con copyright -->
      <div class="footer-bottom">
        <p>&copy; 2026 <strong>Templar-Development-Company</strong>&reg;. Todos los derechos reservados.</p>
        <p>Diseñado y desarrollado por <strong>Aliadex</strong>&trade;</p>
      </div>
    </footer>
    <script type="module" src="/scripts/menuLateral.js"></script>
    <script type="module" src="/scripts/index.js"></script>
  </body>
</html>
